<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미팅 일정 조율</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --ok: #16a34a;
    --ok-soft: #dcfce7;
    --today: #fff7ed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 0;
  }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tab {
    flex: 1 0 auto;
    padding: 10px 12px;
    border: none;
    background: transparent;
    font-size: 14px;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab.result.active { color: var(--ok); border-bottom-color: var(--ok); }

  main { max-width: 760px; margin: 0 auto; padding: 14px 10px 40px; }
  .week-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 10px;
  }
  .week-nav button {
    padding: 8px 12px; border: 1px solid var(--line); background: var(--card);
    border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  .week-nav .range { font-weight: 600; font-size: 15px; text-align: center; flex: 1; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

  table { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 0; }
  th .d { display: block; font-size: 11px; font-weight: 400; }
  th.today { color: var(--accent); }
  td.time { font-size: 11px; color: var(--muted); text-align: right; padding-right: 4px; width: 58px; white-space: nowrap; }
  tr.sep td { padding: 10px 0 2px; border-top: 2px solid #9ca3af; }
  tr.sep span { font-size: 11px; font-weight: 700; color: #4b5563; }
  td.slot {
    height: 38px; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; cursor: pointer; text-align: center; font-size: 12px;
    transition: background .1s;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  td.slot:hover { border-color: var(--accent); }
  td.slot.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  td.slot.all { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; cursor: default; }
  td.slot.partial { background: var(--ok-soft); border-color: var(--ok-soft); color: var(--ok); cursor: default; }
  td.slot.readonly { cursor: default; }
  td.slot.past { background: #eceff3; border-color: #eceff3; cursor: default; }
  td.slot.past:hover { border-color: #eceff3; }
  .week-nav button:disabled { opacity: .35; cursor: default; }
  .banner { background: var(--accent-soft); color: var(--accent); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }
  .banner.error { background: #fef2f2; color: #b91c1c; }
  body.locked td.slot { pointer-events: none; opacity: .5; }
  .week-nav .wk { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .reset-box { margin-top: 18px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; }
  .reset-box p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .reset-box button.danger { padding: 10px 14px; border: 1px solid #fca5a5; background: #fef2f2; color: #b91c1c; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
  td.slot.readonly:hover { border-color: var(--line); }

  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 10px 0; flex-wrap: wrap; }
  .legend span::before {
    content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    margin-right: 5px; vertical-align: -2px; border: 1px solid var(--line);
  }
  .legend .l-on::before { background: var(--accent); border-color: var(--accent); }
  .legend .l-all::before { background: var(--ok); border-color: var(--ok); }
  .legend .l-partial::before { background: var(--ok-soft); border-color: var(--ok-soft); }

  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 16px; }
  .summary h2 { font-size: 15px; margin: 0 0 8px; }
  .summary ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }
  .summary .empty { color: var(--muted); font-size: 13px; }
  .status { font-size: 13px; margin: 0 0 10px; }
  .status b { color: var(--ok); }
  .status .no { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button {
    padding: 8px 12px; border: 1px solid var(--line); background: var(--card);
    border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>미팅 일정 조율</h1>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div id="banner" class="banner" hidden></div>
  <div class="week-nav">
    <button id="prevWeek">◀ 이전 주</button>
    <div class="range" id="weekRange"></div>
    <button id="nextWeek">다음 주 ▶</button>
  </div>
  <p class="hint" id="hint"></p>
  <table id="grid"></table>
  <div class="legend" id="legend"></div>
  <div id="extra"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  // ───────── 설정 ─────────
  const PEOPLE = ['박성훈 교수', '배원규 교수', '신재만 교수'];
  const DAYS = ['월', '화', '수', '목', '금'];
  const START_HOUR = 10;   // 10:00
  const END_HOUR = 19;     // ~19:00 (마지막 칸 18:00~19:00)
  const PIDS = ['p0', 'p1', 'p2'];   // Firestore 문서 안의 사람별 필드 이름 (PEOPLE 순서와 같음)

  // ───────── Firestore (baelab-ledger 프로젝트, meeting/{링크 키} 문서 하나) ─────────
  firebase.initializeApp({
    apiKey: "AIzaSyBXE4UNgFmlnfQ5TkpR6h4DIKE2rjbI0_Q",
    authDomain: "baelab-ledger.firebaseapp.com",
    projectId: "baelab-ledger",
    appId: "1:301215647344:web:9026cd464a9403629516b5"
  });
  const db = firebase.firestore();
  const LINK_KEY = new URLSearchParams(location.search).get('k') || '';
  const docRef = LINK_KEY.length >= 20 ? db.collection('meeting').doc(LINK_KEY) : null;

  // ───────── 상태 ─────────
  // data = { "박성훈 교수": { "2026-10-20": [10, 11, ...] }, ... }
  let data = {};
  let loaded = false;
  let activeTab = 0;                 // 0~2 = 사람, 3 = 결과
  const WEEKS = 2;                   // 이번 주 + 다음 주만 표시 (2주 안에 미팅을 잡는다)
  const WEEK_LABEL = ['이번 주', '다음 주'];
  const baseMonday = mondayOf(new Date());
  let weekIndex = 0;                 // 0 = 이번 주, 1 = 다음 주
  function weekStartOf(i) { return addDays(baseMonday, i * 7); }
  let weekStart = weekStartOf(weekIndex);

  function showBanner(msg, isError) {
    const el = document.getElementById('banner');
    el.textContent = msg; el.className = 'banner' + (isError ? ' error' : ''); el.hidden = !msg;
  }
  // 한 사람의 선택을 통째로 저장 (dotted path 업데이트 → 해제한 날짜도 함께 반영됨)
  async function persist(person) {
    if (!docRef) return;
    const pid = PIDS[PEOPLE.indexOf(person)];
    try {
      await docRef.update({ ['people.' + pid]: data[person] || {}, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    } catch (e) {
      if (e.code === 'not-found') {
        await docRef.set({ people: { [pid]: data[person] || {} }, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      } else {
        showBanner('저장에 실패했습니다: ' + (e.message || e), true);
      }
    }
  }
  async function persistReset() {
    if (!docRef) return;
    try { await docRef.set({ people: {}, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); }
    catch (e) { showBanner('리셋에 실패했습니다: ' + (e.message || e), true); }
  }
  function subscribe() {
    if (!docRef) {
      showBanner('링크에 키가 없습니다. 단톡방에 올라온 전체 링크(…?k=…)로 다시 들어와 주세요.', true);
      return;
    }
    docRef.onSnapshot(snap => {
      const people = (snap.exists && snap.data().people) || {};
      const next = {};
      PEOPLE.forEach((p, i) => { if (people[PIDS[i]] && Object.keys(people[PIDS[i]]).length) next[p] = people[PIDS[i]]; });
      data = next; loaded = true;
      showBanner('');
      render();
    }, e => showBanner('불러오지 못했습니다: ' + (e.message || e), true));
  }

  // ───────── 날짜 유틸 ─────────
  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = (x.getDay() + 6) % 7;   // 월=0 ... 일=6
    x.setDate(x.getDate() - day);
    return x;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function key(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function fmtMD(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }
  const h12 = h => (h > 12 ? h - 12 : h);
  function fmtHour(h) { return `${h12(h)}시~${h12(h + 1)}시`; }   // 12시~1시 형식
  const SECTIONS = { 12: '오후 (점심 이후)', 16: '저녁' };          // 이 시각 앞에 구분선
  function fmtFull(k) {
    const [y, m, d] = k.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return `${y}년 ${m}월 ${d}일 (${DAYS[(dt.getDay() + 6) % 7] || '주말'})`;
  }
  const todayKey = key(new Date());
  const windowKeys = new Set();      // 표시 기간(2주 × 월~금)의 날짜 키
  for (let w = 0; w < WEEKS; w++) for (let i = 0; i < 5; i++) windowKeys.add(key(addDays(weekStartOf(w), i)));
  function isPast(dk, h) {
    // 이미 지난 칸(날짜가 지났거나, 오늘인데 그 시간이 끝난 칸)
    const now = new Date();
    if (dk < todayKey) return true;
    return dk === todayKey && now.getHours() >= h + 1;
  }

  // ───────── 가용 여부 ─────────
  function has(person, dk, h) {
    return !!(data[person] && data[person][dk] && data[person][dk].includes(h));
  }
  function toggle(person, dk, h) {
    data[person] = data[person] || {};
    const arr = data[person][dk] || [];
    const i = arr.indexOf(h);
    if (i >= 0) arr.splice(i, 1); else arr.push(h);
    arr.sort((a, b) => a - b);
    if (arr.length) data[person][dk] = arr; else delete data[person][dk];
    persist(person);
  }
  function countAvailable(dk, h) {
    return PEOPLE.filter(p => has(p, dk, h)).length;
  }
  function allCommonSlots() {
    // 표시 기간(2주) 안에서 3명 모두 가능한 칸을 모은다
    const out = [];
    [...windowKeys].sort().forEach(dk => {
      for (let h = START_HOUR; h < END_HOUR; h++) {
        if (countAvailable(dk, h) === PEOPLE.length) out.push({ dk, h });
      }
    });
    return out;
  }

  // ───────── 렌더 ─────────
  function renderTabs() {
    const nav = document.getElementById('tabs');
    nav.innerHTML = '';
    [...PEOPLE, '✔ 공통 가능 시간'].forEach((name, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === 3 ? ' result' : '') + (i === activeTab ? ' active' : '');
      b.textContent = name;
      b.onclick = () => { activeTab = i; render(); };
      nav.appendChild(b);
    });
  }

  function renderGrid() {
    const isResult = activeTab === 3;
    const person = PEOPLE[activeTab];
    const grid = document.getElementById('grid');
    const days = DAYS.map((_, i) => addDays(weekStart, i));

    document.getElementById('weekRange').innerHTML =
      `<span class="wk">${WEEK_LABEL[weekIndex]}</span> ${fmtMD(days[0])} (월) ~ ${fmtMD(days[4])} (금)`;
    document.getElementById('prevWeek').disabled = weekIndex === 0;
    document.getElementById('nextWeek').disabled = weekIndex === WEEKS - 1;
    document.getElementById('hint').textContent = isResult
      ? '초록색 칸이 세 분 모두 가능한 시간입니다. 연한 초록은 일부만 가능한 시간입니다.'
      : `${person}님, 미팅 가능한 시간 칸을 눌러 주세요. 다시 누르면 해제됩니다.`;

    let html = '<thead><tr><th></th>';
    days.forEach(d => {
      const dk = key(d);
      html += `<th class="${dk === todayKey ? 'today' : ''}">${DAYS[(d.getDay() + 6) % 7]}<span class="d">${fmtMD(d)}</span></th>`;
    });
    html += '</tr></thead><tbody>';

    for (let h = START_HOUR; h < END_HOUR; h++) {
      if (SECTIONS[h]) html += `<tr class="sep"><td colspan="6"><span>${SECTIONS[h]}</span></td></tr>`;
      html += `<tr><td class="time">${fmtHour(h)}</td>`;
      days.forEach(d => {
        const dk = key(d);
        const past = isPast(dk, h);
        if (isResult) {
          const n = past ? 0 : countAvailable(dk, h);
          const cls = past ? 'past' : n === PEOPLE.length ? 'all' : n > 0 ? 'partial' : 'readonly';
          const label = n === PEOPLE.length ? '모두' : n > 0 ? `${n}명` : '';
          html += `<td class="slot ${cls}">${label}</td>`;
        } else if (past) {
          html += `<td class="slot past"></td>`;
        } else {
          const on = has(person, dk, h);
          html += `<td class="slot ${on ? 'on' : ''}" data-dk="${dk}" data-h="${h}">${on ? '✓' : ''}</td>`;
        }
      });
      html += '</tr>';
    }
    html += '</tbody>';
    grid.innerHTML = html;

    if (!isResult) {
      grid.querySelectorAll('td.slot:not(.past)').forEach(td => {
        td.onclick = () => {
          toggle(person, td.dataset.dk, Number(td.dataset.h));
          renderGrid();
        };
      });
    }

    document.getElementById('legend').innerHTML = isResult
      ? '<span class="l-all">세 분 모두 가능</span><span class="l-partial">일부 가능</span>'
      : '<span class="l-on">가능한 시간</span>';
  }

  function renderExtra() {
    const box = document.getElementById('extra');
    if (activeTab === 3) {
      const slots = allCommonSlots();
      const filled = PEOPLE.map(p => `${p}: ${Object.keys(data[p] || {}).length ? '<b>입력함</b>' : '<span class="no">미입력</span>'}`).join(' · ');
      let html = `<div class="summary"><p class="status">${filled}</p><h2>세 분 모두 가능한 시간 (이번 주 + 다음 주)</h2>`;
      if (!slots.length) {
        html += '<p class="empty">아직 세 분 모두 겹치는 시간이 없습니다.</p>';
      } else {
        // 같은 날짜끼리 묶어서 표시
        const byDate = {};
        slots.forEach(s => (byDate[s.dk] = byDate[s.dk] || []).push(s.h));
        html += '<ul>';
        Object.keys(byDate).forEach(dk => {
          const hours = byDate[dk].map(h => (h < 12 ? '오전 ' : '오후 ') + fmtHour(h)).join(', ');
          html += `<li><b>${fmtFull(dk)}</b> — ${hours}</li>`;
        });
        html += '</ul>';
      }
      html += `</div>
      <div class="reset-box">
        <p>미팅이 정해졌거나 새로 날짜를 잡을 때는 리셋하세요. 세 분의 선택이 모두 지워지고 처음부터 다시 입력합니다.</p>
        <button id="resetAll" class="danger">🔄 전체 리셋 (세 분 선택 모두 지우기)</button>
      </div>`;
      box.innerHTML = html;
      document.getElementById('resetAll').onclick = () => {
        if (!confirm('세 분의 선택을 모두 지우고 처음부터 다시 시작할까요?')) return;
        data = {}; persistReset(); weekIndex = 0; weekStart = weekStartOf(0); activeTab = 0; render();
      };
    } else {
      const person = PEOPLE[activeTab];
      box.innerHTML = `<div class="actions">
        <button id="clearMine">${person} 선택 지우기</button>
      </div>`;
      document.getElementById('clearMine').onclick = () => {
        if (!confirm(`${person}님의 선택을 모두 지울까요?`)) return;
        delete data[person]; persist(person); render();
      };
    }
  }

  function render() {
    document.body.classList.toggle('locked', !loaded || !docRef);   // 불러오기 전·키 없음 → 칸 잠금
    renderTabs(); renderGrid(); renderExtra();
  }

  function goWeek(i) {
    if (i < 0 || i >= WEEKS) return;
    weekIndex = i; weekStart = weekStartOf(i); render();
  }
  document.getElementById('prevWeek').onclick = () => goWeek(weekIndex - 1);
  document.getElementById('nextWeek').onclick = () => goWeek(weekIndex + 1);

  render();
  if (docRef) showBanner('불러오는 중…');
  subscribe();
</script>
</body>
</html>
